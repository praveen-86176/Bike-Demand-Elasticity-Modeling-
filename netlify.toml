[build]
  base = "frontend"
  publish = "build"
  command = "npm run build"

# Proxy all /api/* requests to the EC2 backend via Netlify's server-side redirect.
# This solves the HTTPS → HTTP mixed content problem because the request goes:
#   Browser (HTTPS) → Netlify → EC2 port 80 (via nginx reverse proxy)
[[redirects]]
  from = "/api/*"
  to = "http://32.192.164.156/api/:splat"
  status = 200
  force = true

# SPA fallback — send all other routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
